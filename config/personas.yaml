# OCEAN persona grid - full 2^5 factorial (32 personas).
# Trait pole wording is taken verbatim from Table 3.1 of the methodology.
# No trait->rating guidance is included, so personality effects are not prescribed (protects H2).
design: full_factorial_2_5
n_personas: 32

trait_descriptions:
  openness:
    high: "Curious, imaginative and interested in new ideas, art and experiences."
    low: "Prefers familiar and practical ideas and shows less interest in abstract, artistic or imaginative activities."
  conscientiousness:
    high: "Organised, responsible, persistent and self-disciplined."
    low: "Less organised and persistent and may delay tasks or act carelessly."
  extraversion:
    high: "Outgoing, sociable, assertive and energetic."
    low: "Quiet, reserved, less socially active and less likely to take charge."
  agreeableness:
    high: "Compassionate, respectful, trusting and cooperative."
    low: "More critical, less trusting and less compassionate towards others."
  neuroticism:
    high: "Prone to worry, sadness and emotional changes and is more easily upset."
    low: "Relaxed, emotionally stable and able to handle stress well."

